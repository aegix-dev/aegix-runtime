Re-review 2026-Q4, or sooner if rhai publishes a release that drops it.
""" },

    # --- chrono and chrono-tz: wound down by their maintainer (2026-11-17) ---
    # The plan, the measurements and the conditions that void these three
    # entries: docs/engineering-log/packages/2026-11-17-chrono-unmaintained-accepted.md
    # Stage 1 of that plan is done (same date): the workspace's own chrono-tz
    # is gone, and the two chrono-tz entries now stand for neo4rs's copy only.

    { id = "RUSTSEC-2026-0543", reason = """
`chrono` is unmaintained: its maintainer is winding it down
(chronotope/chrono#1768) and recommends `jiff`. The advisory was issued
2026-11-17 and turned main red at an unchanged dependency (chrono 0.4.45).
It states no vulnerability and there is no release to move to.

Accepted, not fixed: 70 crates of the workspace declare chrono and 207 Rust
files name it, timestamps read from the database and written to the wire
among them. Replacing it is a migration, not a fix to clear a flag.

This entry is VOID, and the migration is due, on an advisory of a
