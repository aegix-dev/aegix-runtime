Re-review 2027-Q1.
""" },

    { id = "RUSTSEC-2026-0555", reason = """
`chrono-tz` is unmaintained and no longer follows the IANA time zone
database (the maintainer's answer in chronotope/chrono#1768). No
vulnerability. One copy is left in the tree: 0.8.6 (zone rules of 2024a),
required by `neo4rs` 0.8.0, the latest stable release, in the platform's
`aegix-graph-rag`. Not ours to remove, and no Aegix code asks that copy
