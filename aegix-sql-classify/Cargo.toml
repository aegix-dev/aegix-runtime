[package]
name = "aegix-sql-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately a LEAF: sqlparser and nothing else. This is the single source of
# truth for "does this SQL statement mutate?", shared by the WASM-host worker
# (aegix-worker-runtime) and the controller's signed-RPC handler
# (aegix-rpc-subscribers), so it must stay light enough to pull into the worker
# without dragging in sqlx, tokio, or a web framework.
[dependencies]
sqlparser = { workspace = true, features = ["visitor"] }

[lints]
workspace = true
