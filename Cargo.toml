    "aegix-auth-types",
    "aegix-build-info",
    "aegix-capability-world",
    "aegix-compilation",
    "aegix-config",
    "aegix-dlp-provider",
    "aegix-e2e-probe",
    "aegix-engine-events",
    "aegix-envelope-seal",
    "aegix-http-body",
    "aegix-idempotency",
    "aegix-local-inference",
    "aegix-metrics",
    "aegix-module-source",
    "aegix-nats-tls",
    "aegix-random",
    "aegix-reason-class",
    "aegix-redis",
    "aegix-reference-controller",
    "aegix-replay-guard",
    "aegix-rpc-gates",
    "aegix-rpc-protocol",
    "aegix-runtime",
    "aegix-secrets",
    "aegix-shutdown",
    "aegix-sigstore-policy",
    "aegix-sql-classify",
    "aegix-ssrf-classify",
    "aegix-task-supervision",
    "aegix-text-util",
    "aegix-trace",
    "aegix-trace-nats",
    "aegix-wit-inspector",
    "aegix-worker-runtime",
    "aegix-workflow-engine-core",
    "aegix-workflow-job-protocol",
    "aegix-workflow-liveness",
    "aegix-zones",
    "aegix_sdk_macros",
    "worker",
]

# Shared package metadata. Crates opt in via `version.workspace = true`
# (etc.) in their `[package]` table. Keeping these centralised means a
# version bump or license-string fix touches one file, not eight.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Every third-party dependency that two or more crates use is declared here,
# once, and inherited (`serde.workspace = true`, or
# `{ workspace = true, features = [...] }`). A version bump is one line.
# `scripts/check-workspace-deps.py` (in `make lint`) refuses a second
# declaration of anything listed here, a dependency two crates share that is
# not listed, and an entry nobody inherits.
#
# * Features stay with the crate that needs them. The four entries that
#   carried features before 2026-10-06 (chrono, serde, tokio, uuid) keep
#   them; none of the 58 added that day has any.
# * `default-features = false` here means at least one crate needs the
#   defaults off; a crate that wants them lists `"default"` among its
#   features. Inheritance can add features, it cannot take defaults away.
# * A dependency only one crate uses stays in that crate's manifest.
# * A crate on a different major keeps its own line, marked
#   `# not-inherited: <reason>` (one today: aegix-evaluation, thiserror 1).
[workspace.dependencies]
wat = "1"
# Build a component from WAT at test time (worker/tests, aegix-runtime/tests).
wit-component = "0.224"
wit-parser = "0.224"
aes-gcm = "0.11"
anyhow = "1.0"
arc-swap = "1.7"
async-graphql = "7.2"
async-nats = "0.50"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1.11.1"
cap-std = "4.0"
chrono = { version = "0.4", features = ["serde"] }
# Zone rules only, for `aegix-zones`: default features off, so no crate reads
# the host's zone files or its local zone through this declaration.
jiff = { version = "1", default-features = false }
jiff-tzdb = "1"
dashmap = "6.1.0"
ed25519-dalek = "3"
futures = "0.3"
futures-util = "0.3"
handlebars = "6.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
http = "1"
libc = "0.2"
# NATS nkeys: the worker's identity as a NATS user key, and the auth
# callout's issuer (aegix-nats-callout). async-nats already links it.
nkeys = "0.4"
oci-client = { version = "0.18", default-features = false }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = "0.33"
prometheus = "0.14"
proptest = "1.5"
rand = { version = "0.10", default-features = false }
redis = { version = "1.7", default-features = false }
regex = "1.12"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlparser = "0.63"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.49", features = ["sync", "rt", "macros"] }
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2.5"
uuid = { version = "1.20", features = ["v4", "serde"] }
# The wasmtime family, pinned to the exact patch and moved together. See
# docs/wasmtime-version-tracking.md before changing any of the three.
# Defaults off (2026-10-28): wasmtime's `cache` feature is its on-disk cache
# of compiled modules, which Aegix never configures (the worker keeps its own
# AOT cache), and it was the only path to zstd (RUSTSEC-2026-0391, -0395..0406,
# -0410). A crate lists every other default itself.
wasmtime = { version = "49.0.5", default-features = false }
wasmtime-wasi = "49.0.5"
wasmtime-wasi-http = "49.0.5"
zeroize = "1.8"

# Workspace-level clippy policy.
#
# Goal: keep `cargo clippy -- -D warnings` green so CI catches real
# issues, while opting out of stylistic lints whose suggested rewrites
# would either cost API stability (boxing every error type to satisfy
# `result_large_err`) or readability (adding type aliases for inline
# Pin<Box<dyn Future>> shapes that read fine in context). Each allow
# is a deliberate, documented call — not "shut up, clippy".
#
# When adding a new allow, write a one-liner justification next to it.
# When removing one, run `cargo clippy --workspace -- -D warnings` to
# confirm no regressions.
[workspace.lints.rust]
# Every `unsafe` block needs a local `#[allow(unsafe_code)]` beside its SAFETY
# comment. Crates that do not inherit workspace lints (the engine/protocol
# crates) get no coverage from this line.
unsafe_code = "deny"

[workspace.lints.clippy]
# API-shape lints — flagging an opinionated style of structuring code,
# not a bug. We accept the natural shape and document at call-sites.
too_many_arguments = "allow"   # functions with 8+ args; struct-of-args isn't always cleaner
type_complexity = "allow"      # inline Pin<Box<dyn Future>> reads better than an alias
result_large_err = "allow"     # boxing errors costs API ergonomics for marginal stack savings

# Doc-comment formatting niggles. `cargo doc -D warnings` still catches
# real broken-link issues; these are over-zealous on Markdown layout.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"

# `#[must_use]` attached to a function returning a `#[must_use]` type
# (e.g. `Result`) is redundant but harmless — the type's marker is what
# enforces the check. Removing the function-level attr is a pure
# style change that conveys nothing.
double_must_use = "allow"

# `from_str(&str) -> Result<Self, _>` is ambiguous with `FromStr::from_str`.
# We have a few inherent `from_str` constructors that intentionally don't
# implement FromStr (e.g. arity differs, error type is project-specific).
# Renaming would be a breaking API change for marginal benefit.
should_implement_trait = "allow"

# `match x { Some(s) if s == "literal" => ... }` is, per clippy, more
# clearly written as `Some("literal")`. Both read fine; the pattern-guard
# style is conventional in our MCP arg-matching code.
redundant_guards = "allow"

[profile.dev]
# Cut debug info to line tables only. Full debug info (default) doubles
# the .o write time for every incremental build and balloons target/ on
# disk — for everyday development the only thing it gains is step-through
# debugging, which we rarely use. Stack traces (panic/RUST_BACKTRACE/sentry)
# still resolve to file:line because line tables are preserved.
# Net: 10-20% faster `cargo build` / `cargo check` across the workspace.
debug = "line-tables-only"

[profile.release]
opt-level = 3
debug = false
codegen-units = 4

[profile.docker]
inherits = "release"
opt-level = 1
incremental = false
# 256 codegen units = max parallel codegen. The previous value (4) was
# inherited from `release` where high-CU counts hurt cross-CU inlining
# under opt-level=3 — but this profile is opt-level=1, so the inlining
# trade-off is negligible. Combined with mold (installed in
# controller/Dockerfile and worker/Dockerfile), more CUs just mean more
# parallel cores producing object files for mold to link.
codegen-units = 256
debug = false

# Published images (main-publish.yml / release.yml / publish-images.sh pass
# `CARGO_PROFILE=dist` to the controller + worker Dockerfiles). `docker` above
# stays the fast dev-compose build; shipping opt-level=1 made every production
# node pay for build speed nobody there benefits from.
#   * lto = "thin" + 16 CGUs: most of fat-LTO's cross-crate inlining at a
#     fraction of its link time and memory on a 100-crate workspace.
#   * panic stays `unwind` (inherited): the worker's `guard_codegen_panic`
#     (lint check 53) is a catch_unwind; `abort` would turn one bad guest
#     into a dead worker.
#   * strip = "debuginfo", not "symbols": the symbol table stays, so a panic
#     backtrace still names functions.
[profile.dist]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = "thin"
incremental = false
debug = false
strip = "debuginfo"
