[package]
name = "aegix-envelope-seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RFC 0010 P3 (D3b) controller-side per-execution secret-envelope sealing: in-flight seal-context store, claim handler and claim responder."

[dependencies]
aegix-deploy-posture = { path = "../aegix-deploy-posture" }
aegix-workflow-job-protocol = { path = "../aegix-workflow-job-protocol" }
dashmap.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
serde_json.workspace = true
async-nats.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing.workspace = true
# No metrics registry: the responder counts the claims it drops (B2-3) through
# the `ClaimDropCounter` its caller hands it, so a controller held by
# structural check 109 runs the same responder as the platform's, and this
# crate stays below the platform's metric registry (2026-11-18,
# docs/engineering-log/packages/2026-11-18-metrics-registry-above-the-runtime.md).

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
