# nats-server configuration with ONE SHARED WORKER USER — the shape every
# compose stack ran until 2026-11-06, kept for the MINIMAL stack only
# (docker-compose.minimal.yml, `-c /etc/nats/nats-shared-worker.conf`).
#
# Why the minimal stack still uses it: it pins PUBLISHED images
# (AEGIX_IMAGE_TAG defaults to a commit that predates the NATS auth callout),
# and a worker from such an image can only authenticate with a password. It
# runs ONE worker, so the shared user's one known weakness — every worker may
# subscribe `_WINBOX.>` and read a sibling's RPC replies — has no sibling to
# expose. When the minimal stack's image default moves to a commit that
# carries the callout, it moves to nats.conf with the other stacks and this
# file is deleted (docs/engineering-log/packages/2026-11-06-per-worker-nats-credentials.md).
#
# Bind-mounted as part of deploy/nats (a DIRECTORY, never the file, per
# structural lint check 66). It includes the generated worker permission
# fragment (worker-permissions.conf, also files/nats-worker-permissions.conf in
# the chart), which `aegix-workflow-job-protocol`'s `nats_permissions` tests
# pin byte-for-byte to the Rust sets. JetStream and the monitoring port come
# from the command line (`--jetstream --store_dir=/data -m 8222`), so this file
# carries no `jetstream {}` block — passing both is a "Duplicate 'store_dir'"
# parse error.

# 8 MiB payload cap — matches the controller's RPC upper bound.
max_payload: 8388608

# Defines WORKER_PERMISSIONS (subscribe allow-list, publish deny-list).
include "worker-permissions.conf"

# Two credentials, resolved from the container environment at server start
# (a missing variable is a config-parse failure, so the server refuses to
# start rather than admitting an unrestricted anonymous worker). The server
# LEXES a resolved value as a config token, and the grammar cannot quote a
# reference (`"$NATS_PASSWORD"` is the literal string), so a password must
# begin with a letter: one that begins with a digit is read as a number and
# `2e0f…` refuses to start. scripts/nats-password.sh mints that shape
# (2026-10-30, packages/2026-10-30-nats-password-lexes-as-a-string.md).
#   NATS_USER / NATS_PASSWORD               — the CONTROLLER; no permissions
#                                             block (it is the trusted party and
#                                             replies into `_WINBOX.>`).
#   NATS_WORKER_USER / NATS_WORKER_PASSWORD — every WORKER; WORKER_PERMISSIONS.
authorization {
  users = [
    { user: $NATS_USER, password: $NATS_PASSWORD }
    { user: $NATS_WORKER_USER, password: $NATS_WORKER_PASSWORD, permissions: $WORKER_PERMISSIONS }
  ]
}
