[package]
name = "aegix-idempotency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json"], optional = true }
chrono.workspace = true
hex.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
aegix-redis = { path = "../aegix-redis" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[features]
# The HTTP middleware (`idempotency_middleware`) and the header helpers it
# alone uses. Default OFF so a crate that wants the dedup store or the Redis
# reservation (the worker runtime, and through it `aegix-runtime`) does not
# link a web framework. The controller enables it.
axum = ["dep:axum"]

[[test]]
name = "middleware_integration"
required-features = ["axum"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
