[package]
name = "aegix-reference-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A small controller for the Aegix runtime: it holds secrets, signs a module dispatch to a credential-free worker over NATS, seals the secret envelope, and answers the worker's actor-memory calls through the dispatch-binding and write-ceiling gates. Its record is held in memory; it links no database, no workflow engine and no API surface (structural check 109)."

[[bin]]
name = "aegix-reference-controller"
path = "src/main.rs"

[dependencies]
# `refuse_wildcard_grant`: a module's grants name what they grant.
aegix-capability-world = { path = "../aegix-capability-world" }
# `Requirement` (a worker key must name a dispatch) and the posture predicate.
aegix-auth-types = { path = "../aegix-auth-types" }
aegix-deploy-posture = { path = "../aegix-deploy-posture" }
# The claim responder and its in-flight seal store. It links no metrics
# registry; this crate hands the responder `claim_drops_uncounted`.
aegix-envelope-seal = { path = "../aegix-envelope-seal" }
aegix-random = { path = "../aegix-random" }
# Admission and the two gates, over this crate's in-memory ledger.
aegix-rpc-gates = { path = "../aegix-rpc-gates" }
# The memory protocol's wire types and the key registry requests verify
# against.
aegix-rpc-protocol = { path = "../aegix-rpc-protocol" }
# `world_fit_at_dispatch`: a module is checked against the world it declares,
# by the rule the worker links it with.
aegix-wit-inspector = { path = "../aegix-wit-inspector" }
aegix-dispatch-types = { path = "../aegix-dispatch-types" }
# `JobRequest` / `JobResult`, their signatures, the secret envelope, the
# sealing types and the subjects.
aegix-workflow-job-protocol = { path = "../aegix-workflow-job-protocol" }
async-nats.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
# A real component, to check a module against the world it declares.
wat.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
