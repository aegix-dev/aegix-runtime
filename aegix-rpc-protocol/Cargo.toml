[package]
name = "aegix-rpc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The signed worker → controller data-plane RPC protocols (rpc_auth and the per-subject request/reply types) with no database, embedding or HTTP dependency, so the embeddable runtime carries wire types without linking Postgres (structural check 109)."

# A leaf below the runtime boundary (2026-10-30,
# docs/engineering-log/packages/2026-10-30-rpc-protocols-below-the-runtime-boundary.md):
# no sqlx, no pgvector, no reqwest. Check 109 refuses `sqlx` and `pgvector`
# anywhere in aegix-runtime's closure, which this crate is in; a new
# dependency here is a boundary change.
[dependencies]
aegix-deploy-posture = { path = "../aegix-deploy-posture" }
aegix-random = { path = "../aegix-random" }
# The SINGLE per-worker identity-key surface — Ed25519 key parsing and the
# AEGIX_WORKER_SIGNING_KEY / AEGIX_WORKER_PUBLIC_KEYS registry — so RPC signing
# shares the keypair the worker uses for result signing, and `RawSigned<T>`,
# whose ONE home is that crate. No cycle: job-protocol does not depend on
# this crate.
aegix-workflow-job-protocol = { path = "../aegix-workflow-job-protocol" }
arc-swap.workspace = true
dashmap.workspace = true
# Same major as aegix-workflow-job-protocol so the re-exported key types unify.
ed25519-dalek.workspace = true
hmac.workspace = true
serde = { workspace = true, features = ["derive"] }
# `raw_value` powers `rpc_auth::RawSigned<T>`: signed bodies cover the EXACT
# wire text (Box<RawValue>) so serde_json's non-idempotent f64 round trip
# can't make signer and verifier disagree (#598). Declared here because this
# crate USES the feature directly — do not rely on transitive unification via
# aegix-workflow-job-protocol, which could vanish under a future dep change.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
subtle.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# The SHARED wire-invariant property harness (seeded `arbitrary_json`, the
# round-trip-unstable float counterexamples, the wire/transcode hop helpers).
# Same path dependency as above, re-declared here purely to turn on the
# non-default `test-support` feature for TEST builds: `cargo build` of this
# crate (and of everything that depends on it) still resolves job-protocol
# with default features, so the harness never enters a production binary.
aegix-workflow-job-protocol = { path = "../aegix-workflow-job-protocol", features = [
    "test-support",
] }
# Hex encoding for the literal MAC digests in tests/wire_format_snapshots.rs.
hex.workspace = true

[lints]
workspace = true
