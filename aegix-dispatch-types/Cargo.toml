[package]
name = "aegix-dispatch-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The data model a runtime and whatever dispatches to it share: the dispatch key, the secret map and its envelope, the three ceilings a job carries, how a module's bytes ride a message, inference-wait accounting and the fuel keys. Types and pure functions only."
repository = "https://github.com/aegix-dev/aegix-runtime"
homepage = "https://github.com/aegix-dev/aegix-runtime"

# A leaf below the runtime boundary (2026-11-18,
# docs/engineering-log/packages/2026-11-18-dispatch-types-below-the-engine.md):
# cut out of aegix-workflow-engine-core, which re-exports every item at its
# old path. No workspace dependency, no async runtime, no I/O; a new
# dependency here is a boundary change (check 109).
[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize.workspace = true

# lints-not-inherited: the table of the crate these modules were written
# under ([lints.rust] forbids unsafe code; [lints.clippy] turns on pedantic).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
